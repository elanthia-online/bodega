name: Update Map IDs

# Refresh shop_mapping.json map IDs from ps.lichproject.org and redeploy.
# Like the main pipeline, this commits nothing: it restores current site
# data, updates shop_mapping.json, and republishes to Pages.

on:
  workflow_dispatch:

concurrency:
  group: bodega-pipeline
  cancel-in-progress: false

env:
  SITE_URL: https://shops.elanthia.online

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: '3.1'

      - name: Restore current site data
        run: |
          chmod +x automation/bin/fetch-site-data
          ./automation/bin/fetch-site-data "$SITE_URL"

      - name: Scrape and update map IDs
        run: ruby automation/ruby/update_map_ids.rb

      - name: Stage site (exclude raw)
        run: |
          mkdir -p _site
          rsync -a --exclude='data/raw/' docs/ _site/
          test -f _site/index.html || { echo "ERROR: index.html missing"; exit 1; }
          test -f _site/data/shop_mapping.json || { echo "ERROR: shop_mapping.json missing"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        timeout-minutes: 10
