name: Update Map IDs

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - name: Set up Ruby
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
      with:
        ruby-version: '3.1'

    - name: Scrape and update map IDs
      run: ruby automation/ruby/update_map_ids.rb

    - name: Commit and push if changed
      run: |
        git config user.name "Bodega Automation"
        git config user.email "automation@bodega.local"

        git add docs/data/shop_mapping.json

        if git diff --staged --quiet; then
          echo "No changes to shop_mapping.json"
          exit 0
        fi

        git commit -m "Update shop map IDs from ps.lichproject.org"
        git push origin master
