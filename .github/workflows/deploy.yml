name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Verify docs structure
      run: |
        echo "Checking docs folder structure..."
        ls -la docs/
        echo "Checking docs/data folder..."
        ls -la docs/data/

    - name: Stage site (exclude raw scan data)
      run: |
        # The web app only loads processed data/*.json (town files,
        # removed_items, added_items, shop_mapping). docs/data/raw/ is
        # consumed by processor.rb server-side and is not fetched by the
        # browser, so exclude it to keep the Pages artifact small.
        mkdir -p _site
        rsync -a --exclude='data/raw/' docs/ _site/
        echo "Staged site size:"
        du -sh _site
        echo "Confirming raw/ is excluded:"
        ls -la _site/data/ | grep -q raw && echo "ERROR: raw/ still present" && exit 1 || echo "OK: data/raw/ excluded"

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: '_site'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      timeout-minutes: 10  # Increase from default ~5 minutes
