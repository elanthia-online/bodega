name: Process

on:
  workflow_dispatch:
    inputs:
      town:
        description: 'Specific town to process (leave empty for all)'
        required: false
        default: ''
        type: string

# Prevent concurrent processing
concurrency:
  group: bodega-processing
  cancel-in-progress: false

# Least-privilege token: push data commits + dispatch deploy.yml
permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - name: Set up Ruby
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
      with:
        ruby-version: '3.1'

    - name: Process raw data
      env:
        # Pass dispatch inputs via env, never inline into the script body
        TOWN_INPUT: ${{ github.event.inputs.town }}
      run: |
        chmod +x automation/bin/process-data
        ./automation/bin/process-data "$TOWN_INPUT"

    - name: Commit and push processed data
      id: commit
      run: |
        git config user.name "Bodega Processing"
        git config user.email "processing@bodega.local"

        # Add all processed data files (not raw)
        git add docs/data/*.json
        git add docs/data/removed_items.json || true
        git add docs/data/last_updated.txt || true

        if git diff --staged --quiet; then
          echo "No changes to commit"
          echo "changes_pushed=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        git commit -m "Process data - $(date '+%Y-%m-%d %H:%M UTC')"

        # Rebase on the live tip and push, retrying if another workflow
        # (automation, update-map-ids) pushes in between. --autostash
        # preserves any unstaged/untracked files across the rebase.
        pushed=false
        for attempt in 1 2 3 4 5; do
          git fetch origin master
          git rebase --autostash origin/master
          if git push origin master; then
            pushed=true
            break
          fi
          echo "Push rejected (attempt $attempt), retrying..."
          sleep $((attempt * 5))
        done
        if [ "$pushed" != "true" ]; then
          echo "Failed to push after 5 attempts"
          exit 1
        fi

        echo "changes_pushed=true" >> $GITHUB_OUTPUT

    - name: Trigger deployment
      if: steps.commit.outputs.changes_pushed == 'true'
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
          -d '{"ref":"master"}'

    - name: Archive processing logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: processing-logs-${{ github.run_number }}
        path: automation/logs/
        retention-days: 30
