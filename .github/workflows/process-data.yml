name: Process

on:
  workflow_dispatch:
    inputs:
      town:
        description: 'Specific town to process (leave empty for all)'
        required: false
        default: ''
        type: string

# Prevent concurrent processing
concurrency:
  group: bodega-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Set up Ruby
      uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
      with:
        ruby-version: '3.1'

    - name: Process raw data
      run: |
        chmod +x automation/bin/process-data
        ./automation/bin/process-data "${{ github.event.inputs.town }}"

    - name: Commit and push processed data
      id: commit
      run: |
        git config user.name "Bodega Processing"
        git config user.email "processing@bodega.local"

        # Add all processed data files (not raw)
        git add docs/data/*.json
        git add docs/data/removed_items.json || true
        git add docs/data/last_updated.txt || true

        if git diff --staged --quiet; then
          echo "No changes to commit"
          echo "changes_pushed=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        git commit -m "Process data - $(date '+%Y-%m-%d %H:%M UTC')"

        # Fetch latest and rebase our commit on top
        # If there are content conflicts on data files, prefer our freshly processed version
        git fetch origin master
        git rebase origin/master || {
          git checkout --ours docs/data/
          git add docs/data/
          git rebase --continue
        }
        git push origin master

        echo "changes_pushed=true" >> $GITHUB_OUTPUT

    - name: Trigger deployment
      if: steps.commit.outputs.changes_pushed == 'true'
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
          -d '{"ref":"master"}'

    - name: Archive processing logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: processing-logs-${{ github.run_number }}
        path: automation/logs/
        retention-days: 30
