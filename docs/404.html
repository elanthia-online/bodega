<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · GemStone IV Playershops</title>
    <meta name="robots" content="noindex">
    <!-- Absolute paths: GitHub Pages serves this page for any missing URL, at any depth -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #333;
            --muted: #555;
            --accent: #357abd;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --card: #2a2a2a;
                --text: #e0e0e0;
                --muted: #b0b0b0;
                --accent: #2f6fb7;
            }
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }
        main {
            max-width: 480px;
            padding: 32px;
            background: var(--card);
            border-radius: 8px;
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }
        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.5;
        }
        a {
            display: inline-block;
            padding: 10px 18px;
            background: var(--accent);
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>There's nothing at this address. Shop and item links all start from the main page, so the link you followed may be mistyped or out of date.</p>
        <a href="/">Go to GemStone IV Playershops</a>
    </main>
</body>
</html>
